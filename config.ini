[COT]
COT_IP = 192.168.1.3
COT_PORT = 8087
COT_PROTOCOL = tcp
COT_TLS = false
; Facultatif si COT_TLS = true (certificat client TAK, format PEM)
COT_CERTFILE =
COT_KEYFILE =
COT_CAFILE =
COT_VERIFY = true

[Scheduler]
; Intervalle global par défaut (secondes), surchargeable par source
POLLING_INTERVAL = 600

; Chaque section [Source:<nom>] active une source.
; 'type' correspond au nom enregistré dans le registre.
[Source:nhc]
type = nhc
enabled = true
url = https://www.nhc.noaa.gov/CurrentStorms.json
; Cône de trajectoire (polygone)
include_cone = true
cone_max_points = 80
; Ligne centrale de la trajectoire prévue (polyligne ouverte)
include_track = true
track_max_points = 60



[Source:usgs_quakes]
type = usgs_quakes
enabled = true
url = https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson
interval = 300